# Runs after a push to master that changes VERSION.md (see the trigger below).
# Publishes a release only when VERSION.md is above the newest v* tag;
# otherwise every job after "Version" is skipped.
# Then the same files are copied to Mysttic/Mysttic, the public site, under
# the tag simple-rest-v<version>, and that project's older releases there are
# removed. Needs the HUB_TOKEN secret (see CONTRIBUTING.md, "Releases").
# The full CI suite is not repeated here: the pull request from develop into
# master ran it on this very tree a few minutes earlier (see ci.yml). What does
# run is a short "Tests" job, and only when a version is actually being
# published. master is not a protected branch, so a direct push can reach this
# workflow without ever passing through a pull request, and the "site" job
# below deletes the previous release from Mysttic/Mysttic for good - there is
# nothing to roll back to once a broken build is published.
name: Release

on:
  # The push trigger is limited to VERSION.md, the only file the "Version" job
  # reads the version from (scripts/release-version.sh). A merge that leaves it
  # alone can never publish anything, yet it used to start a runner just to
  # find that out - a billed minute with no build and no release.
  # What follows from the filter:
  # - a push to master that does not touch VERSION.md starts nothing at all,
  #   not even "Version";
  # - a push that edits VERSION.md without raising the number still costs the
  #   one-minute "Version" job, and everything after it is skipped;
  # - an edit to this workflow alone, a CHANGELOG.md fix pushed after a run
  #   that stopped for a missing "## [x.y.z]" section, or any merge or push
  #   without VERSION.md (a code fix, say) after a run that failed before the
  #   tag or never started, starts no release by itself (on a pull request
  #   from develop the "Release preview" in ci.yml warns about it): use
  #   "Run workflow" (workflow_dispatch) on master, which compares VERSION.md
  #   with the newest tag the same way and publishes only while v<version>
  #   does not exist yet. A run that failed after creating the tag
  #   (for instance in "site") is retried with "Re-run failed jobs" instead.
  # - a push of more than 3,000 changed files may not start the workflow even
  #   when VERSION.md is one of them (GitHub's limit on path filters): use
  #   "Run workflow" on master.
  push:
    branches: [master]
    paths:
      - 'VERSION.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    # "Run workflow" lets anyone pick a branch; releasing from anything but
    # master would tag an unreviewed commit and replace the site's release.
    # Skipping this job skips every job after it.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      previous: ${{ steps.v.outputs.previous }}
      publishing: ${{ steps.v.outputs.publishing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare VERSION.md with the newest tag
        id: v
        run: |
          set -o pipefail
          sh scripts/release-version.sh | tee -a "$GITHUB_OUTPUT"

      - name: Decision
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PUBLISHING: ${{ steps.v.outputs.publishing }}
        run: |
          if [ "$PUBLISHING" = "true" ]; then
            echo "Publishing v$VERSION." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "VERSION.md was not raised ($VERSION is already released), nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: Tests
    needs: version
    if: needs.version.outputs.publishing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-release-test-${{ hashFiles('go.mod', '**/*.go') }}
          restore-keys: ${{ runner.os }}-gobuild-release-test-
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Unit tests only: no end to end run and no build. The three-platform
      # build happens in "release" right below, and ui.html is embedded with
      # //go:embed, so a broken interface compiles cleanly and only these
      # tests catch it.
      - name: Go tests
        run: go test ./... -count=1

      - name: UI tests
        run: node --test "tests/**/*.test.mjs"

  release:
    name: Release on GitHub
    needs: [version, test]
    if: needs.version.outputs.publishing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # setup-go caches modules, and this repository has none. What pays off
      # is the compiler cache, here across three platforms.
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-release-${{ hashFiles('go.mod', '**/*.go') }}
          restore-keys: ${{ runner.os }}-gobuild-release-

      - name: Build every platform
        run: sh build.sh

      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          {
            sh scripts/changelog-section.sh "$VERSION"
            echo
            echo "Pobieranie: https://mysttic.github.io/Mysttic/simple-rest/"
          } > notes.md
          cat notes.md

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(ls -1 dist | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::error::Expected 4 files in dist (3 binaries and the checksums), got $count."
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "simple-rest $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
          echo "Released $TAG with $count files." >> "$GITHUB_STEP_SUMMARY"

  site:
    name: Copy to the site
    needs: [version, release]
    if: needs.version.outputs.publishing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUB: Mysttic/Mysttic
      PROJECT: simple-rest
      NAME: simple-rest
      SITE: https://mysttic.github.io/Mysttic/simple-rest/
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      HUB_TAG: simple-rest-v${{ needs.version.outputs.version }}
    steps:
      - name: Credential for the site repository
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${HUB_TOKEN:-}" ]; then
            echo "::error::No HUB_TOKEN secret. Release $TAG was made, the copy to the site was not."
            echo "::error::Needs a personal token with Contents: read and write on $HUB."
            exit 1
          fi

      - name: Files from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p copy
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir copy --pattern "$PROJECT-*"
          ls -la copy
          if [ "$(ls -1 copy | wc -l)" -ne 4 ]; then
            echo "::error::Expected four files in release $TAG."
            exit 1
          fi

      - name: Release notes
        run: |
          set -euo pipefail
          {
            echo "$NAME $VERSION"
            echo
            echo "$SITE"
          } > notes.md
          cat notes.md

      - name: Release on the site
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$HUB_TAG" --repo "$HUB" >/dev/null 2>&1; then
            gh release delete "$HUB_TAG" --repo "$HUB" --cleanup-tag --yes
          fi
          gh release create "$HUB_TAG" copy/* \
            --repo "$HUB" \
            --title "$NAME $VERSION" \
            --notes-file notes.md \
            --target master

      - name: The site keeps one version
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo "$HUB" --limit 100 --json tagName -q '.[].tagName' \
            | { grep -E "^$PROJECT-v" || true; } \
            | { grep -vxF "$HUB_TAG" || true; } \
            | while read -r old; do
                echo "Deleting $old"
                gh release delete "$old" --repo "$HUB" --cleanup-tag --yes
              done
          echo "$HUB_TAG stays on the site" >> "$GITHUB_STEP_SUMMARY"
