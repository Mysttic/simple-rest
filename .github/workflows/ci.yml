# Runs the tests on a pull request from develop into master, on a manual run
# and when another workflow calls it. Nothing else starts CI any more: a push
# to develop, or a pull request into develop, runs nothing at all.
#
# A pull request into master from a branch other than develop leaves every job
# skipped, and GitHub reports such a run as green. That is a deliberate trade
# for the Actions minutes this account has left, not a gap to be plugged with
# a gate job that fails the run.
#
# The build of every platform stays: on a linux/amd64 runner neither go vet
# nor go test ever compiles restart_windows.go (//go:build windows), and gofmt
# only reads the source, so "sh build.sh" is the only step here that proves the
# windows/amd64, linux/arm64 and linux/arm targets still build and the .deb
# packages still pack. What went is the dist/ artifact it used to upload.
#
# A pull request into master also gets a preview of what merging it publishes
# (scripts/next-version.sh). The commit messages are checked by commits.yml.
name: CI

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'site/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    # github.head_ref is empty outside a pull request, so a manual run and a
    # workflow_call still reach the steps.
    if: github.event_name != 'pull_request' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # setup-go caches modules, and this repository has none. What pays off
      # is the compiler cache that go vet and go test fill.
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-test-${{ hashFiles('go.mod', '**/*.go') }}
          restore-keys: ${{ runner.os }}-gobuild-test-
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: gofmt and go vet
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt wants to change: $unformatted"
            exit 1
          fi
          go vet ./...

      - name: Go tests
        run: go test ./... -count=1

      - name: UI tests
        run: node --test "tests/**/*.test.mjs"

      # Cross-compiles windows/amd64, linux/amd64, linux/arm64 and linux/arm
      # into dist/ and packs the .deb packages. Nothing uploads dist/; the point
      # is that the build fails here, on the pull request, instead of in
      # release.yml after the merge.
      - name: Build every platform
        env:
          REQUIRE_DEB: '1'
        run: sh build.sh

  e2e:
    name: Update path end to end
    if: github.event_name != 'pull_request' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-e2e-${{ hashFiles('go.mod', '**/*.go') }}
          restore-keys: ${{ runner.os }}-gobuild-e2e-
      - name: A 0.9.0 copy updates itself from a fake hub
        run: sh scripts/e2e-update.sh

  release-preview:
    name: Release preview
    if: github.event_name == 'pull_request' && github.base_ref == 'master' && github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # HEAD is the test merge of this PR into master, so the commits read are
      # the ones the merge brings to master.
      - name: Read the commits since the newest tag
        id: v
        run: |
          set -o pipefail
          sh scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"

      - name: What merging does
        env:
          PREVIOUS: ${{ steps.v.outputs.previous }}
          BUMP: ${{ steps.v.outputs.bump }}
          NEXT: ${{ steps.v.outputs.next }}
        run: |
          if [ -z "$NEXT" ]; then
            echo "No feat, fix, perf or breaking change since $PREVIOUS: merging publishes nothing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Merging this PR publishes **v$NEXT** ($BUMP, newest release so far: $PREVIOUS), copies it to the site and hands it to the package channels." >> "$GITHUB_STEP_SUMMARY"
          fi
