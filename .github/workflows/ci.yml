# Runs the tests on a pull request from develop into master, on a manual run
# and when another workflow calls it. Nothing else starts CI any more: a push
# to develop, or a pull request into develop, runs nothing at all.
#
# A pull request into master from a branch other than develop leaves every job
# skipped, and GitHub reports such a run as green. That is a deliberate trade
# for the Actions minutes this account has left, not a gap to be plugged with
# a gate job that fails the run.
#
# The three-platform build stays: on a linux/amd64 runner neither go vet nor
# go test ever compiles restart_windows.go (//go:build windows), and gofmt only
# reads the source, so "sh build.sh" is the only step here that proves the
# windows/amd64 and linux/arm64 targets still build. What went is the dist/
# artifact it used to upload - that upload, not the build itself, was this
# repository's largest consumer of the account-wide Actions storage.
#
# A pull request into master also gets a preview of what merging it publishes.
name: CI

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'README.pl.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'site/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    # github.head_ref is empty outside a pull request, so a manual run and a
    # workflow_call still reach the steps.
    if: github.event_name != 'pull_request' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # setup-go caches modules, and this repository has none. What pays off
      # is the compiler cache that go vet and go test fill.
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-test-${{ hashFiles('go.mod', '**/*.go') }}
          restore-keys: ${{ runner.os }}-gobuild-test-
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: gofmt and go vet
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt wants to change: $unformatted"
            exit 1
          fi
          go vet ./...

      - name: Go tests
        run: go test ./... -count=1

      - name: UI tests
        run: node --test "tests/**/*.test.mjs"

      # Cross-compiles windows/amd64, linux/amd64 and linux/arm64 into dist/.
      # Nothing uploads dist/ any more; the point is that the build fails here,
      # on the pull request, instead of in release.yml after the merge.
      - name: Build every platform
        run: sh build.sh

  e2e:
    name: Update path end to end
    if: github.event_name != 'pull_request' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-e2e-${{ hashFiles('go.mod', '**/*.go') }}
          restore-keys: ${{ runner.os }}-gobuild-e2e-
      - name: A 0.9.0 copy updates itself from a fake hub
        run: sh scripts/e2e-update.sh

  release-preview:
    name: Release preview
    if: github.event_name == 'pull_request' && github.base_ref == 'master' && github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare VERSION.md with the newest tag
        id: v
        run: |
          set -o pipefail
          sh scripts/release-version.sh | tee -a "$GITHUB_OUTPUT"

      - name: What merging does
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PREVIOUS: ${{ steps.v.outputs.previous }}
          PUBLISHING: ${{ steps.v.outputs.publishing }}
        # release.yml starts on a push to master only when that push changes
        # VERSION.md. HEAD here is the test merge of this PR into master, so
        # HEAD^1 is master and this diff is what the merge pushes. A version
        # left unreleased by an earlier failed (or never started) run is not
        # published by a merge that leaves VERSION.md alone.
        run: |
          touched=$(git diff --name-only HEAD^1 HEAD -- VERSION.md)
          if [ "$PUBLISHING" != "true" ]; then
            echo "VERSION.md holds $VERSION, the same as the newest release: merging publishes nothing." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$touched" ]; then
            msg="VERSION.md holds $VERSION, not released yet (newest release: $PREVIOUS), but this PR does not change VERSION.md: merging it starts no release. After the merge use Run workflow on the Release workflow, on master."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Merging this PR publishes **v$VERSION** (newest release so far: $PREVIOUS) and copies it to the site." >> "$GITHUB_STEP_SUMMARY"
          fi
